name: One-time sync of CI #163 visualization snapshots

on:
  push:
    branches:
      - audit/verified-distance-semantics
    paths:
      - .github/workflows/sync-ci-163-images.yml

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: audit/verified-distance-semantics
          fetch-depth: 0

      - name: Download the exact CI #163 artifact
        uses: actions/download-artifact@v4
        with:
          name: eda-visualizations
          run-id: 45837867717
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: /tmp/ci163

      - name: Replace only the five audited PNGs and validate all images
        shell: bash
        run: |
          set -euo pipefail
          replacements=(
            bab_v/distribusi_numerik.png
            bab_v/ecdf_variabel_numerik.png
            bab_v/skewness_kurtosis.png
            bab_vii/heatmap_spearman.png
            bab_vii/multi_panel_parameter_waktu.png
          )
          test "$(find /tmp/ci163 -type f -name '*.png' | wc -l)" -eq 37
          for rel in "${replacements[@]}"; do
            test -s "/tmp/ci163/$rel"
            install -D "/tmp/ci163/$rel" "outputs/$rel"
          done

          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re
          import sys

          artifact = Path("/tmp/ci163")
          output = Path("outputs")
          pngs = sorted(p.relative_to(artifact) for p in artifact.rglob("*.png"))
          if len(pngs) != 37:
              raise SystemExit(f"Expected 37 artifact PNGs, found {len(pngs)}")

          mismatches = []
          for rel in pngs:
              src, dst = artifact / rel, output / rel
              if not dst.is_file():
                  mismatches.append(f"missing: outputs/{rel.as_posix()}")
              elif hashlib.sha256(src.read_bytes()).digest() != hashlib.sha256(dst.read_bytes()).digest():
                  mismatches.append(f"hash mismatch: outputs/{rel.as_posix()}")
          if mismatches:
              raise SystemExit("\n".join(mismatches))
          print("PASS: all 37 tracked PNGs exactly match artifact #163")

          # Validate local Markdown image targets (including HTML img src attributes).
          errors = []
          patterns = (
              re.compile(r"!\\[[^\\]]*\\]\\(([^)]+)\\)"),
              re.compile(r"""<img\\b[^>]*\\bsrc=["']([^"']+)["']""", re.IGNORECASE),
          )
          for md in Path(".").rglob("*.md"):
              if any(part in {".git", ".venv", "venv"} for part in md.parts):
                  continue
              content = md.read_text(encoding="utf-8")
              targets = []
              for pattern in patterns:
                  targets.extend(pattern.findall(content))
              for raw in targets:
                  target = raw.strip().split(maxsplit=1)[0].strip("<>")
                  if target.startswith(("https://", "http://", "data:", "#")):
                      continue
                  target = target.split("#", 1)[0].split("?", 1)[0]
                  if not target:
                      continue
                  resolved = (md.parent / target).resolve()
                  if not resolved.is_file():
                      errors.append(f"{md}: {target}")
          if errors:
              raise SystemExit("Broken local Markdown image links:\\n" + "\\n".join(errors))
          print("PASS: all local Markdown image links resolve")
          PY

          mapfile -t changed < <(git status --short --untracked-files=no | awk '{print $2}' | sort)
          expected="$(printf '%s\\n' ${replacements[@]} | sort)"
          actual="$(printf '%s\\n' "${changed[@]}")"
          if [[ "$actual" != "$expected" ]]; then
            printf 'Unexpected tracked changes:\\n%s\\n' "$actual"
            exit 1
          fi

      - name: Commit only the five PNG replacements
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            outputs/bab_v/distribusi_numerik.png \
            outputs/bab_v/ecdf_variabel_numerik.png \
            outputs/bab_v/skewness_kurtosis.png \
            outputs/bab_vii/heatmap_spearman.png \
            outputs/bab_vii/multi_panel_parameter_waktu.png
          git commit -m "chore(visuals): sync five PNGs with CI artifact 163"
          git push origin HEAD:audit/verified-distance-semantics
