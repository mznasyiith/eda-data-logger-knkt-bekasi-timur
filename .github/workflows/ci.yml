name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff black
      - name: Ruff
        run: ruff check src tests scripts --select E4,E7,E9,F
      - name: Black
        run: black --check scripts
      - name: Tests
        run: pytest
