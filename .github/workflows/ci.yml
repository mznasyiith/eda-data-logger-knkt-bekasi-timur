name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

# All CI events are read-only. Generated outputs are published as artifacts;
# no workflow run pushes commits back to a branch.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # For PRs, test the exact PR head commit, not a moving branch ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m pip install --upgrade "setuptools>=84.1.0"
          python -m pip check
      - name: Dependency vulnerability audit
        run: |
          python -m pip install pip-audit
          pip-audit --skip-editable
      - name: Ruff
        run: ruff check src tests scripts app.py --select E4,E7,E9,F
      - name: Format and audit Python scripts
        run: black --diff --check scripts app.py src/eda_knkt/dashboard.py tests/test_dashboard.py
      - name: Execute all notebooks in order
        run: |
          mkdir -p /tmp/eda-executed
          jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=180 --output-dir /tmp/eda-executed notebooks/*.ipynb
      - name: Generate visual artifacts
        run: python scripts/generate_visuals.py
      - name: Upload visual artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: eda-visualizations
          path: outputs/
          if-no-files-found: error
          retention-days: 14
      - name: Tests
        run: pytest
