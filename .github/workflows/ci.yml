name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests scripts --select E4,E7,E9,F
      - name: Format and audit Python scripts
        run: |
          black scripts
          black --check scripts
      - name: Execute all notebooks in order
        run: |
          mkdir -p /tmp/eda-executed
          jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=180 --output-dir /tmp/eda-executed notebooks/*.ipynb
      - name: Generate visual artifacts
        run: python scripts/generate_visuals.py
      - name: Commit generated visual outputs to repository
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/ scripts/
          if ! git diff --cached --quiet; then
            git commit -m "Publish reproducible EDA visual outputs"
            git pull --rebase origin main
            git push
          fi
      - name: Upload visual artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eda-visualizations
          path: outputs/
          if-no-files-found: error
          retention-days: 14
      - name: Tests
        run: pytest
