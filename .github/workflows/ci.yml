name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests scripts --select E4,E7,E9,F
      - name: Black formatting audit
        continue-on-error: true
        run: black --check scripts
      - name: Execute all notebooks in order
        run: |
          mkdir -p /tmp/eda-executed
          jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=180 --output-dir /tmp/eda-executed notebooks/*.ipynb
      - name: Generate visual artifacts
        run: python scripts/generate_visuals.py
      - name: Upload visual artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eda-visualizations
          path: outputs/
          if-no-files-found: error
          retention-days: 14
      - name: Tests
        run: pytest
