name: CI
on:
  workflow_dispatch:
    inputs:
      branch:
        description: PR head branch to receive generated outputs
        required: true
        default: audit/verified-distance-semantics
        type: string
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

# Default-deny write access. PR validation must remain read-only.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Pin PR validation to the exact tested head; manual runs use the
          # explicitly selected branch. No write token is exposed to PR code.
          ref: ${{ github.event.pull_request.head.sha || inputs.branch || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests scripts --select E4,E7,E9,F
      - name: Format and audit Python scripts
        run: black --check scripts
      - name: Execute all notebooks in order
        run: |
          mkdir -p /tmp/eda-executed
          jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=180 --output-dir /tmp/eda-executed notebooks/*.ipynb
      - name: Generate visual artifacts
        run: python scripts/generate_visuals.py
      - name: Upload visual artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eda-visualizations
          path: outputs/
          if-no-files-found: error
          retention-days: 14
      - name: Tests
        run: pytest

  # Only an explicitly requested workflow_dispatch run can write generated
  # outputs back to a branch. This job is isolated from pull_request events.
  publish-generated:
    if: github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Regenerate visual artifacts
        run: python scripts/generate_visuals.py
      - name: Commit generated outputs
        env:
          HEAD_BRANCH: ${{ inputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/
          if ! git diff --cached --quiet; then
            git commit -m "chore: synchronize generated EDA visualizations"
            git push origin "HEAD:${HEAD_BRANCH}"
          else
            echo "Generated outputs are already synchronized."
          fi
