name: Feature request
description: Usulkan peningkatan analisis, dokumentasi, atau perangkat lunak
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Kebutuhan atau masalah
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Usulan solusi
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Data atau bukti pendukung
      description: Jelaskan sumber, asumsi, dan keterbatasan.
    validations:
      required: false
